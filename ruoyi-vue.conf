# /etc/nginx/conf.d/ruoyi-vue.conf
server {
    listen       80;
    server_name  192.168.9.228;          # 有域名就换成域名

    # 站点根：软链，发布只切链，配置不动
    root  /data/apps/ruoyi-vue/current;
    index index.html;

    charset utf-8;
    client_max_body_size 50m;            # 若依有文件/头像上传

    access_log /var/log/nginx/ruoyi-vue.access.log;
    error_log  /var/log/nginx/ruoyi-vue.error.log warn;

    # 后端接口：/prod-api/xxx -> http://127.0.0.1:8180/xxx
    location /prod-api/ {
        proxy_pass         http://127.0.0.1:8180/;   # 末尾斜杠负责剥掉 /prod-api
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;                     # 导入/导出类接口较慢
        proxy_send_timeout 300s;
    }

    # 带 hash 的静态资源，长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口文件不缓存，避免发版后仍命中旧 HTML
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vue history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 兜底：将来若有人把 root 指回上级目录，也不泄露包和脚本
    location ~* \.(sh|tar\.gz|tgz|zip|log)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;
    # 构建产物已生成 .gz（VITE_BUILD_COMPRESS=gzip），模块存在时可开启：
    # gzip_static on;
}
